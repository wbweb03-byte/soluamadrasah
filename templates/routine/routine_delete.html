{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Routine</title>

    <link rel="stylesheet" href="{% static 'css/routine/routine_delete.css' %}">

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    padding:20px;
}

.delete-card{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
    text-align:center;
}

.icon{
    font-size:55px;
    margin-bottom:15px;
}

h2{
    color:#dc3545;
    margin-bottom:10px;
}

.message{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

.details{
    text-align:left;
    background:#f8f9fa;
    border-radius:8px;
    padding:18px;
    margin-bottom:25px;
}

.details div{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.details div:last-child{
    margin-bottom:0;
}

.details strong{
    color:#333;
}

.details span{
    color:#555;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

.delete-btn,
.cancel-btn{
    padding:12px 28px;
    border:none;
    border-radius:6px;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    transition:.3s;
}

.delete-btn{
    background:#dc3545;
    color:#fff;
}

.delete-btn:hover{
    background:#bb2d3b;
}

.cancel-btn{
    background:#6c757d;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.cancel-btn:hover{
    background:#565e64;
}
    </style>
</head>
<body>

<div class="container">

    <form method="POST" class="delete-card">
        {% csrf_token %}

        <div class="icon">⚠️</div>

        <h2>Delete Routine</h2>

        <p class="message">
            Are you sure you want to delete this routine?
        </p>

        <div class="details">

            <div>
                <strong>Class</strong>
                <span>{{ routine.student_class.name }}</span>
            </div>

            <div>
                <strong>Subject</strong>
                <span>{{ routine.subject.name }}</span>
            </div>

            <div>
                <strong>Teacher</strong>
                <span>{{ routine.teacher.name }}</span>
            </div>

            <div>
                <strong>Period</strong>
                <span>{{ routine.period }}</span>
            </div>

        </div>

        <div class="buttons">

            <button type="submit" class="delete-btn">
                Delete
            </button>

            <a href="{% url 'routine_list' %}" class="cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
