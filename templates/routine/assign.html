{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Subject</title>

    <link rel="stylesheet" href="{% static 'css/assign_teacher/assign.css' %}">

    <style>

        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#f4f6f9;
    display:flex;
    justify-content:center;
    padding:40px;

}

.container{

    width:900px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.1);

}

h2{

    text-align:center;
    margin-bottom:25px;

}

.class-box{

    display:flex;
    flex-direction:column;
    margin-bottom:25px;

}

.class-box label{

    margin-bottom:8px;
    font-weight:bold;

}

.class-box select{

    height:42px;
    padding:10px;

}

.heading{

    display:grid;
    grid-template-columns:2fr 2fr 1fr;
    font-weight:bold;
    margin-bottom:10px;

}

.subject-row{

    display:grid;
    grid-template-columns:2fr 2fr 1fr;
    gap:15px;
    margin-bottom:15px;

}

.subject-row input,
.subject-row select{

    height:42px;
    padding:10px;

}

.btn-area{

    display:flex;
    gap:10px;
    margin-top:15px;

}

.add{

    background:#28a745;
    color:white;
    border:none;
    padding:10px 18px;
    cursor:pointer;
    border-radius:5px;

}

.remove{

    background:#dc3545;
    color:white;
    border:none;
    padding:10px 18px;
    cursor:pointer;
    border-radius:5px;

}

.submit{

    margin-top:30px;
    text-align:center;

}

.submit button{

    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 40px;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;

}
    </style>
    
</head>
<body>

<div class="container">

<form method="POST">
{% csrf_token %}

<h2>Assign Subject To Class</h2>

<div class="class-box">

    <label>Select Class</label>

    <select name="student_class" required>

        <option value="">Select Class</option>

        {% for cls in classes %}
        <option value="{{ cls.id }}">{{ cls.name }}</option>
        {% endfor %}

    </select>

</div>


<div class="heading">

    <span>Subject</span>
    <span>Teacher</span>
    <span>Period</span>

</div>

<div id="subjectContainer">

    <div class="subject-row">

        <input
            type="text"
            name="subject[]"
            placeholder="Subject Name"
            required
        >

        <select name="teacher[]" required>

            <option value="">Teacher</option>

            {% for teacher in teachers %}
            <option value="{{ teacher.id }}">
                {{ teacher.name }}
            </option>
            {% endfor %}

        </select>

        <input
            type="number"
            name="period[]"
            placeholder="Period"
            min="1"
            required
        >

    </div>

</div>

<div class="btn-area">

    <button type="button" class="add" onclick="addRow()">
        + Add Subject
    </button>

    <button type="button" class="remove" onclick="removeRow()">
        Remove
    </button>

</div>

<div class="submit">

    <button type="submit">
        Save
    </button>

</div>

</form>

</div>

<script>

const container=document.getElementById("subjectContainer");

function addRow(){

    const teacherOptions=`
        <option value="">Teacher</option>

        {% for teacher in teachers %}
        <option value="{{ teacher.id }}">
            {{ teacher.name }}
        </option>
        {% endfor %}
    `;

    const row=document.createElement("div");

    row.className="subject-row";

    row.innerHTML=`

        <input
            type="text"
            name="subject[]"
            placeholder="Subject Name"
            required
        >

        <select name="teacher[]" required>

            ${teacherOptions}

        </select>

        <input
            type="number"
            name="period[]"
            placeholder="Period"
            min="1"
            required
        >
    `;

    container.appendChild(row);

}

function removeRow(){

    if(container.children.length>1){

        container.removeChild(container.lastElementChild);

    }

}

</script>

</body>
</html>
