{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Class</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7">

            <div class="card shadow border-0 rounded-4">

                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">Add New Class</h3>
                </div>

                <div class="card-body p-4">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form id="classForm" method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Class Name
                            </label>

                            <input
                                type="text"
                                id="className"
                                name="name"
                                class="form-control form-control-lg"
                                placeholder="Example: I, II, III"
                                autocomplete="off"
                                required
                            >

                            <div id="error" class="text-danger mt-2 fw-bold"></div>

                        </div>

                        <div class="d-grid">

                            <button class="btn btn-primary btn-lg">

                                Save Class

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{{ classes|json_script:"class-data" }}

<script>

const classInput=document.getElementById("className");
const form=document.getElementById("classForm");
const error=document.getElementById("error");

const classes=JSON.parse(
    document.getElementById("class-data").textContent
);

classInput.addEventListener("input",function(){

    this.value=this.value.toUpperCase();

    error.textContent="";

    this.classList.remove("is-invalid");

});

form.addEventListener("submit",function(e){

    const value=classInput.value.trim().toUpperCase();

    const exists=classes.some(
        cls=>cls.name.toUpperCase()===value
    );

    if(exists){

        e.preventDefault();

        error.textContent="❌ This class already exists.";

        classInput.classList.add("is-invalid");

        classInput.focus();

    }

});

</script>

</body>
</html>
